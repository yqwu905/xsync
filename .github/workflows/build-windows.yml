name: Build xsync (Windows .exe & Linux CI)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (.exe + Portable Zip + Setup)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC x64 Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.8.3 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          install-deps: 'false'

      - name: Locate or Install OpenSSL 3 x64
        shell: pwsh
        run: |
          $ssl = $null
          foreach ($cand in @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL",
            "C:\Strawberry\c"
          )) {
            if (Test-Path "$cand\include\openssl\ssl.h") {
              $ssl = $cand
              break
            }
          }
          if (-not $ssl) {
            Write-Host "Installing OpenSSL via Chocolatey..."
            choco install openssl --no-progress -y
            $ssl = "C:\Program Files\OpenSSL-Win64"
          }
          Write-Host "Found OpenSSL at: $ssl"
          "OPENSSL_ROOT_DIR=$ssl" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure & Build xsync.exe (Release)
        shell: pwsh
        run: |
          $qtRoot = if ($env:QT_ROOT_DIR) { $env:QT_ROOT_DIR } else { $env:Qt6_DIR }
          cmake -S . -B build-win64 -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qtRoot" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DXSYNC_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-win64 --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Unit, Transfer & Memory Stability Tests (Windows)
        shell: pwsh
        run: |
          $qtRoot = if ($env:QT_ROOT_DIR) { $env:QT_ROOT_DIR } else { $env:Qt6_DIR }
          $env:PATH = "$qtRoot\bin;$env:OPENSSL_ROOT_DIR\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "windows"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          ctest --test-dir build-win64 --output-on-failure -V
          if ($LASTEXITCODE -ne 0) {
            $code = $LASTEXITCODE
            Write-Host "CTest failed with exit code $code; capturing test_ui diagnostic log..."
            & .\build-win64\test_ui.exe -v1 -o build-win64\test_ui_diag.log,txt
            Write-Host "test_ui.exe direct exit code: $LASTEXITCODE"
            if (Test-Path build-win64\test_ui_diag.log) {
              Get-Content build-win64\test_ui_diag.log
            }
            exit $code
          }

      - name: Package Portable xsync.exe & Dependencies
        shell: pwsh
        run: |
          $qtRoot = if ($env:QT_ROOT_DIR) { $env:QT_ROOT_DIR } else { $env:Qt6_DIR }
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist\xsync | Out-Null
          Copy-Item build-win64\xsync.exe dist\xsync\xsync.exe

          & "$qtRoot\bin\windeployqt.exe" `
            --release `
            --no-compiler-runtime `
            --no-translations `
            --no-opengl-sw `
            --no-system-d3d-compiler `
            dist\xsync\xsync.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Bundle OpenSSL 3 runtime DLLs
          foreach ($dll in @("libcrypto-3-x64.dll", "libssl-3-x64.dll")) {
            $src = Join-Path "$env:OPENSSL_ROOT_DIR\bin" $dll
            if (-not (Test-Path $src)) { $src = Join-Path "$env:OPENSSL_ROOT_DIR" $dll }
            if (Test-Path $src) { Copy-Item $src "dist\xsync\$dll" -Force }
          }

          # Bundle EXACT matching MSVC runtime DLLs from the active compiler toolset
          # (Avoids loading an older pre-14.40 msvcp140.dll which crashes on 14.40+ std::mutex)
          $vcRedist = $null
          if ($env:VCToolsRedistDir) {
            $vcRedist = Get-ChildItem (Join-Path $env:VCToolsRedistDir "x64\Microsoft.VC14*.CRT") -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $vcRedist) {
            $vcRedist = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
          }
          if (-not $vcRedist) {
            throw "Failed to locate matching MSVC CRT redistributable directory!"
          }
          Write-Host "Bundling MSVC CRT from: $($vcRedist.FullName)"
          Copy-Item "$($vcRedist.FullName)\*.dll" dist\xsync\ -Force

          $crtInfo = (Get-Item dist\xsync\msvcp140.dll).VersionInfo
          $crtMajorMinor = [version]"$($crtInfo.FileMajorPart).$($crtInfo.FileMinorPart)"
          $toolParts = ($env:VCToolsVersion -split '\.')
          $toolMajorMinor = [version]"$($toolParts[0]).$($toolParts[1])"
          Write-Host "Bundled msvcp140.dll version: $($crtInfo.FileVersion) ($crtMajorMinor) vs VCToolsVersion: $env:VCToolsVersion ($toolMajorMinor)"
          if ($crtMajorMinor -lt $toolMajorMinor) {
            throw "Bundled msvcp140.dll ($crtMajorMinor) is older than compiler toolset ($toolMajorMinor)!"
          }

          # Pin Qt plugin discovery strictly to the local installation folder
          Set-Content -Path dist\xsync\qt.conf -Value "[Paths]`r`nPlugins = .`r`n" -Encoding Ascii

          # Standalone clean-environment smoke test of the exact packaged xsync.exe
          Write-Host "Running isolated standalone smoke test on dist\xsync\xsync.exe..."
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path dist\xsync\xsync.exe).Path
          $psi.WorkingDirectory = (Resolve-Path dist\xsync).Path
          $smokePng = Join-Path (Resolve-Path dist).Path "smoke_test.png"
          $psi.Arguments = "--screenshot `"$smokePng`""
          $psi.UseShellExecute = $false
          $psi.Environment["PATH"] = "C:\Windows\System32;C:\Windows;C:\Windows\System32\Wbem"
          foreach ($v in @("QT_ROOT_DIR", "Qt6_DIR", "QT_PLUGIN_PATH", "QML2_IMPORT_PATH", "QT_QPA_PLATFORM", "OPENSSL_ROOT_DIR")) {
            $psi.Environment.Remove($v) | Out-Null
          }
          $proc = [System.Diagnostics.Process]::Start($psi)
          if (-not $proc.WaitForExit(30000)) {
            $proc.Kill()
            throw "Packaged dist\xsync\xsync.exe timed out during standalone smoke test!"
          }
          Write-Host "Packaged xsync.exe exited with code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            throw "Packaged dist\xsync\xsync.exe crashed/failed with exit code $($proc.ExitCode)!"
          }
          if (-not (Test-Path $smokePng) -or (Get-Item $smokePng).Length -lt 10240) {
            throw "Packaged dist\xsync\xsync.exe did not render a valid window screenshot!"
          }
          Write-Host "Standalone smoke test PASSED! Screenshot size: $((Get-Item $smokePng).Length) bytes"
          Remove-Item $smokePng -Force

          Compress-Archive -Path dist\xsync\* -DestinationPath dist\xsync-windows-x64-portable.zip -Force
          Get-ChildItem dist\xsync | Format-Table Name, Length

      - name: Build Windows Installer (xsync-windows-x64-setup.exe)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc scripts\installer.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Inno Setup not present, skipping installer build."
          }

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xsync-windows-x64
          path: |
            dist/xsync-windows-x64-portable.zip
            dist/xsync-windows-x64-setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/xsync-windows-x64-portable.zip
            dist/xsync-windows-x64-setup.exe
          generate_release_notes: true

  build-linux:
    name: Linux x64 CI & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev zlib1g-dev libgl1-mesa-dev libxkbcommon-dev xvfb rsync

      - name: Install Qt 6.8.3 (Linux GCC x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'

      - name: Build & Test on Linux
        run: |
          QT_PREFIX="${QT_ROOT_DIR:-$Qt6_DIR}"
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DXSYNC_BUILD_TESTS=ON
          cmake --build build-linux -j"$(nproc)"
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-linux --output-on-failure
