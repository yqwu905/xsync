name: Build xsync (Windows .exe & Linux CI)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (.exe + Portable Zip + Setup)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC x64 Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.8.3 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          install-deps: 'false'

      - name: Locate or Install OpenSSL 3 x64
        shell: pwsh
        run: |
          $ssl = $null
          foreach ($cand in @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL",
            "C:\Strawberry\c"
          )) {
            if (Test-Path "$cand\include\openssl\ssl.h") {
              $ssl = $cand
              break
            }
          }
          if (-not $ssl) {
            Write-Host "Installing OpenSSL via Chocolatey..."
            choco install openssl --no-progress -y
            $ssl = "C:\Program Files\OpenSSL-Win64"
          }
          Write-Host "Found OpenSSL at: $ssl"
          "OPENSSL_ROOT_DIR=$ssl" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure & Build xsync.exe (Release)
        shell: pwsh
        run: |
          cmake -S . -B build-win64 -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DXSYNC_BUILD_TESTS=ON
          cmake --build build-win64 --parallel

      - name: Run Unit, Transfer & Memory Stability Tests (Windows)
        shell: pwsh
        run: |
          $env:PATH = "$env:Qt6_DIR\bin;$env:OPENSSL_ROOT_DIR\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "windows"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          ctest --test-dir build-win64 --output-on-failure -V
          if ($LASTEXITCODE -ne 0) {
            $code = $LASTEXITCODE
            Write-Host "CTest failed with exit code $code; capturing test_ui diagnostic log..."
            & .\build-win64\test_ui.exe -v1 -o build-win64\test_ui_diag.log,txt
            Write-Host "test_ui.exe direct exit code: $LASTEXITCODE"
            if (Test-Path build-win64\test_ui_diag.log) {
              Get-Content build-win64\test_ui_diag.log
            }
            exit $code
          }

      - name: Package Portable xsync.exe & Dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\xsync | Out-Null
          Copy-Item build-win64\xsync.exe dist\xsync\xsync.exe

          & "$env:Qt6_DIR\bin\windeployqt.exe" `
            --release `
            --no-translations `
            --no-opengl-sw `
            --no-system-d3d-compiler `
            dist\xsync\xsync.exe

          # Bundle OpenSSL 3 runtime DLLs
          foreach ($dll in @("libcrypto-3-x64.dll", "libssl-3-x64.dll")) {
            $src = Join-Path "$env:OPENSSL_ROOT_DIR\bin" $dll
            if (-not (Test-Path $src)) { $src = Join-Path "$env:OPENSSL_ROOT_DIR" $dll }
            if (Test-Path $src) { Copy-Item $src "dist\xsync\$dll" -Force }
          }

          # Bundle MSVC runtime DLLs for clean execution on fresh Windows machines
          $vcRedist = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vcRedist) {
            Copy-Item "$($vcRedist.FullName)\*.dll" dist\xsync\ -Force
          }

          Compress-Archive -Path dist\xsync\* -DestinationPath dist\xsync-windows-x64-portable.zip
          Get-ChildItem dist\xsync | Format-Table Name, Length

      - name: Build Windows Installer (xsync-windows-x64-setup.exe)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc scripts\installer.iss
          } else {
            Write-Host "Inno Setup not present, skipping installer build."
          }

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xsync-windows-x64
          path: |
            dist/xsync-windows-x64-portable.zip
            dist/xsync-windows-x64-setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/xsync-windows-x64-portable.zip
            dist/xsync-windows-x64-setup.exe
          generate_release_notes: true

  build-linux:
    name: Linux x64 CI & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev zlib1g-dev libgl1-mesa-dev libxkbcommon-dev xvfb rsync

      - name: Install Qt 6.8.3 (Linux GCC x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'

      - name: Build & Test on Linux
        run: |
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR" \
            -DXSYNC_BUILD_TESTS=ON
          cmake --build build-linux -j"$(nproc)"
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-linux --output-on-failure
